name: Add Post
description: Submit a new blog post or article
title: "[Post] "
labels: ["post"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the post
      placeholder: My Awesome Post
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The category of the post
      options:
        - announcement
        - news
        - event
        - tutorial
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: Content
      description: Write your post content here (Markdown supported)
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Cover Image
      description: Path to cover/hero image (e.g. /images/posts/foo.jpg). Leave empty if none.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Info
      description: Any extra details — date, author, language, translations, excerpt, featured flag, etc. (Markdown or plain text)
    validations:
      required: false
