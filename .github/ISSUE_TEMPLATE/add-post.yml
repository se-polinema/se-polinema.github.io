name: Add Post
description: Submit a new blog post or article
title: "[Post] "
labels: ["post"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the post
      placeholder: My Awesome Post
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      description: Author name
      placeholder: SE Lab
      value: SE Lab
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The category of the post
      options:
        - announcement
        - news
        - event
        - tutorial
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: Content
      description: Write your post content here (Markdown supported)
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Cover Image
      description: Path to cover/hero image (e.g. /images/posts/foo.jpg)
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Info
      description: Any other details (e.g., date, language, excerpt, title in Bahasa Indonesia, featured flag). All fields not listed above will use sensible defaults.
      placeholder: |
        date: 2026-06-25
        lang: id
        featured: true
        excerpt: A short summary here
    validations:
      required: false
