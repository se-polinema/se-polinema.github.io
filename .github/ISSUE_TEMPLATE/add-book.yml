name: Add Book
description: Submit a new book reference
title: "[Book] "
labels: ["book"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the book
      placeholder: The Pragmatic Programmer
    validations:
      required: true

  - type: input
    id: researcher
    attributes:
      label: Researcher
      description: Which researcher should this book be associated with? (leave empty if unsure)
      placeholder: dian-hanifudin-subhi
    validations:
      required: false

  - type: input
    id: cover_image
    attributes:
      label: Cover Image
      description: Path or URL to the book cover image
      placeholder: /images/books/pragmatic-programmer.jpg
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Info
      description: Any other details about the book (e.g., description, Play Store URL, etc.)
      placeholder: |
        description: A must-read for every developer.
        playstore_url: https://play.google.com/store/books/details?id=...
    validations:
      required: false
