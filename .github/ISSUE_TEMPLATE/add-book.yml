name: Add Book
description: Submit a new book reference
title: "[Book] "
labels: ["book"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the book
      placeholder: The Pragmatic Programmer
    validations:
      required: true

  - type: input
    id: researcher
    attributes:
      label: Researcher
      description: Which researcher should this book be associated with? (leave empty if unsure)
      placeholder: dian-hanifudin-subhi
    validations:
      required: false

  - type: input
    id: image
    attributes:
      label: Cover Image
      description: Path to the book cover image (e.g. /images/books/foo.jpg). Leave empty if none.
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: Additional Info
      description: Any other details — description, Play Store URL, etc. (Markdown or plain text)
    validations:
      required: false
