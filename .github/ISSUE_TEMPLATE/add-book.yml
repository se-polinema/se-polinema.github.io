name: Add Book
description: Submit a new book reference
title: "[Book] "
labels: ["book"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the book
      placeholder: The Pragmatic Programmer
    validations:
      required: true

  - type: input
    id: researcher
    attributes:
      label: Researcher
      description: Which researcher should this book be associated with? (leave empty if unsure)
      placeholder: dian-hanifudin-subhi
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description of the book
    validations:
      required: false

  - type: input
    id: playstore_url
    attributes:
      label: Play Store URL
      description: Link to the book on Google Play Store (optional)
      placeholder: https://play.google.com/store/books/details?id=...
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: Additional Info
      description: Any other details about the book
    validations:
      required: false
