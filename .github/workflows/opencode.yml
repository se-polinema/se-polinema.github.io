name: OpenCode IssueOps

on:
  issue_comment:
    types: [created, edited]

jobs:
  plan:
    if: >
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/plan') &&
      github.actor == 'dhanifudin'
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-plan-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@latest

      - name: Reply with implementation plan
        run: opencode github run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          MODEL: ${{ vars.OPENCODE_PLAN_MODEL || 'opencode-go/kimi-k2.7-code' }}
          AGENT: plan
          USE_GITHUB_TOKEN: 'true'
          PROMPT: |
            Read the full GitHub issue title, body, and discussion before replying.

            This run is for planning only.

            Reply in the issue with:
            1. A short summary of the request and current discussion.
            2. A concrete implementation plan.
            3. The expected files or areas to change.
            4. The validation plan, including npm run build.
            5. A screenshot plan if the issue affects UI.
            6. Any assumptions or open questions.

            Rules:
            - Do not edit files.
            - Do not create a branch.
            - Do not create a pull request.
            - Do not implement the change yet.
            - Mention that only dhanifudin can approve implementation by commenting exactly /build.

  build:
    if: >
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/build') &&
      github.actor == 'dhanifudin'
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-build-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      SCREENSHOT_PATH: .github/screenshots/issue-${{ github.event.issue.number }}.png
      PREVIEW_PORT: "4321"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_WORKFLOW_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@latest

      - name: Configure git identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Implement approved plan
        run: opencode github run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_PAT }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          MODEL: ${{ vars.OPENCODE_BUILD_MODEL || 'opencode-go/deepseek-v4-pro' }}
          AGENT: build
          USE_GITHUB_TOKEN: 'true'
          PROMPT: |
            Read the full GitHub issue title, body, and discussion before acting.
            Find the latest OpenCode plan in the issue discussion and implement that approved plan.

            Requirements:
            - Implement the approved plan in this repository.
            - Create or update a pull request linked to issue #${{ github.event.issue.number }}.
            - Do not switch to any provider other than OpenCode Go.
            - The workflow will run final build verification with npm run build after implementation.
            - If the issue cannot be implemented safely, explain why in the issue instead of opening a PR.

      - name: Resolve OpenCode pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            })
            const prefix = `opencode/issue${context.issue.number}-`
            const pr = data
              .filter(p => p.head.ref.startsWith(prefix))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]
            if (!pr) {
              core.setFailed(`No open OpenCode PR found for issue #${context.issue.number}`)
              return
            }
            core.setOutput('number', String(pr.number))
            core.setOutput('branch', pr.head.ref)

      - name: Checkout implementation branch
        run: |
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}

      - name: Verify build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture feature screenshot
        run: |
          mkdir -p .github/screenshots
          npm run preview -- --host 127.0.0.1 --port "${PREVIEW_PORT}" > /tmp/opencode-preview.log 2>&1 &
          PREVIEW_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PREVIEW_PORT}" >/dev/null; then
              break
            fi
            sleep 2
          done
          npx playwright screenshot --device="Desktop Chrome" "http://127.0.0.1:${PREVIEW_PORT}" "${SCREENSHOT_PATH}"
          kill "${PREVIEW_PID}"

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SCREENSHOT_PATH}"
          if ! git diff --cached --quiet; then
            git commit -m "Add issue screenshot"
            git push origin "HEAD:${BRANCH}"
          fi
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-issue-${{ github.event.issue.number }}-screenshot
          path: ${{ env.SCREENSHOT_PATH }}

      - name: Update pull request body
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const pull_number = Number('${{ steps.pr.outputs.number }}')
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })
            const branch = process.env.BRANCH
            const screenshotUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${process.env.SCREENSHOT_PATH}`
            const marker = '<!-- opencode-issue-summary -->'
            const summary = `${marker}\n## OpenCode Automation\n- Approved by: @${context.actor}\n- Issue: #${context.issue.number}\n- Build: \`npm run build\` passed in workflow\n- Screenshot artifact: \`opencode-issue-${context.issue.number}-screenshot\`\n\n### Screenshot\n![Updated feature](${screenshotUrl})`
            const body = pr.body?.includes(marker)
              ? pr.body.replace(new RegExp(`${marker}[\\s\\S]*$`), summary)
              : `${pr.body ?? ''}\n\n${summary}`.trim()
            await github.rest.pulls.update({ owner, repo, pull_number, body })
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
