name: OpenCode IssueOps

on:
  issue_comment:
    types: [created, edited]

jobs:
  check-auth:
    if: >
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/plan') || startsWith(github.event.comment.body, '/build'))
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      command: ${{ steps.parse.outputs.command }}
      allowed: ${{ steps.verify.outputs.allowed }}
      extra_context: ${{ steps.parse.outputs.extra_context }}
    steps:
      - name: Parse command and extra context
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if echo "$COMMENT" | grep -q '^/plan'; then
            echo "command=plan" >> "$GITHUB_OUTPUT"
            CONTEXT=$(echo "$COMMENT" | sed 's|^/plan[[:space:]]*||')
          elif echo "$COMMENT" | grep -q '^/build'; then
            echo "command=build" >> "$GITHUB_OUTPUT"
            CONTEXT=$(echo "$COMMENT" | sed 's|^/build[[:space:]]*||')
          fi
          echo "extra_context=${CONTEXT}" >> "$GITHUB_OUTPUT"

      - name: Verify organization membership
        id: verify
        run: |
          ACTOR="${{ github.actor }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/orgs/se-polinema/public_members/${ACTOR}")
          if [ "${HTTP_CODE}" = "204" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "User ${ACTOR} is a public member of se-polinema"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "User ${ACTOR} is NOT a public member of se-polinema (HTTP ${HTTP_CODE})"
          fi

  plan:
    needs: check-auth
    if: >
      needs.check-auth.outputs.allowed == 'true' &&
      needs.check-auth.outputs.command == 'plan'
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-plan-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@latest

      - name: Reply with implementation plan
        run: opencode github run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          MODEL: ${{ vars.OPENCODE_PLAN_MODEL || 'opencode-go/kimi-k2.7-code' }}
          AGENT: plan
          USE_GITHUB_TOKEN: 'true'
          PROMPT: |
            Read the full GitHub issue title, body, and discussion before replying.

            This run is for planning only.
            ${{ needs.check-auth.outputs.extra_context }}

            Reply in the issue with:
            1. A short summary of the request and current discussion.
            2. A concrete implementation plan.
            3. The expected files or areas to change.
            4. The validation plan, including npm run build.
            5. A screenshot plan if the issue affects UI.
            6. Any assumptions or open questions.

            Rules:
            - Do not edit files.
            - Do not create a branch.
            - Do not create a pull request.
            - Do not implement the change yet.
            - Mention that only se-polinema organization members can approve implementation by commenting exactly /build.

  build:
    needs: check-auth
    if: >
      needs.check-auth.outputs.allowed == 'true' &&
      needs.check-auth.outputs.command == 'build'
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-build-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      SCREENSHOT_PATH: .github/screenshots/issue-${{ github.event.issue.number }}.png
      PREVIEW_PORT: "4321"
    steps:
      - name: Extract screenshot target path
        id: screenshot-path
        run: |
          ISSUE_BODY="${{ github.event.issue.body }}"
          TARGET="/"
          ROUTE=$(echo "$ISSUE_BODY" | grep -oP 'route[:\s]+(/[a-zA-Z0-9\-_/]*)' | head -1 | sed 's/route[:\s]*//')
          if [ -n "$ROUTE" ]; then
            TARGET="$ROUTE"
          else
            ALT=$(echo "$ISSUE_BODY" | grep -oP '(?:path|url|page|screenshot)[:\s]+(/[a-zA-Z0-9\-_/]*)' | head -1 | sed 's/.*[:\s]\{1,\}//')
            if [ -n "$ALT" ]; then
              TARGET="$ALT"
            fi
          fi
          echo "url_path=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_WORKFLOW_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@latest

      - name: Configure git identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Implement approved plan
        id: implementation
        continue-on-error: true
        run: opencode github run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_WORKFLOW_PAT }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          MODEL: ${{ vars.OPENCODE_BUILD_MODEL || 'opencode-go/deepseek-v4-pro' }}
          AGENT: build
          USE_GITHUB_TOKEN: 'true'
          PROMPT: |
            Read the full GitHub issue title, body, and discussion before acting.
            Find the latest OpenCode plan in the issue discussion and implement that approved plan.
            ${{ needs.check-auth.outputs.extra_context }}

            Requirements:
            - Implement the approved plan in this repository.
            - Create or update a pull request linked to issue #${{ github.event.issue.number }}.
            - Do not switch to any provider other than OpenCode Go.
            - The workflow will run final build verification with npm run build after implementation.
            - If the issue cannot be implemented safely, explain why in the issue instead of opening a PR.

      - name: Resolve OpenCode pull request
        id: pr
        if: steps.implementation.outcome == 'success' || steps.implementation.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            })
            const prefix = `opencode/issue${context.issue.number}-`
            const pr = data
              .filter(p => p.head.ref.startsWith(prefix))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]
            if (!pr) {
              core.setOutput('found', 'false')
              core.setOutput('number', '')
              core.setOutput('branch', '')
              return
            }
            core.setOutput('found', 'true')
            core.setOutput('number', String(pr.number))
            core.setOutput('branch', pr.head.ref)

      - name: Check PR found
        if: steps.pr.outputs.found == 'false'
        run: |
          echo "No OpenCode PR was created. The implementation step may have failed."
          exit 1

      - name: Checkout implementation branch
        run: |
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}

      - name: Verify build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture feature screenshot
        run: |
          mkdir -p .github/screenshots
          npm run preview -- --host 127.0.0.1 --port "${PREVIEW_PORT}" > /tmp/opencode-preview.log 2>&1 &
          PREVIEW_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PREVIEW_PORT}" >/dev/null; then
              break
            fi
            sleep 2
          done
          npx playwright screenshot --device="Desktop Chrome" "http://127.0.0.1:${PREVIEW_PORT}${SCREENSHOT_URL_PATH}" "${SCREENSHOT_PATH}"
          kill "${PREVIEW_PID}"
        env:
          SCREENSHOT_URL_PATH: ${{ steps.screenshot-path.outputs.url_path }}

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-issue-${{ github.event.issue.number }}-screenshot
          path: ${{ env.SCREENSHOT_PATH }}

      - name: Publish screenshot to assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_WORKFLOW_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          if git clone --depth 1 --branch screenshots "$REMOTE" /tmp/shots 2>/dev/null; then
            : # branch exists
          else
            git clone --depth 1 "$REMOTE" /tmp/shots
            git -C /tmp/shots checkout --orphan screenshots
            git -C /tmp/shots rm -rf . >/dev/null 2>&1 || true
          fi
          git -C /tmp/shots config user.name "github-actions[bot]"
          git -C /tmp/shots config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "${SCREENSHOT_PATH}" "/tmp/shots/issue-${ISSUE_NUMBER}.png"
          git -C /tmp/shots add "issue-${ISSUE_NUMBER}.png"
          git -C /tmp/shots commit -m "Screenshot for issue #${ISSUE_NUMBER}" || exit 0
          git -C /tmp/shots push origin screenshots
        env:
          GH_WORKFLOW_PAT: ${{ secrets.GH_WORKFLOW_PAT }}

      - name: Update pull request body
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const pull_number = Number('${{ steps.pr.outputs.number }}')
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })
            const runId = context.runId
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`
            const artifactName = `opencode-issue-${context.issue.number}-screenshot`
            const screenshotUrl = `https://raw.githubusercontent.com/${owner}/${repo}/screenshots/issue-${context.issue.number}.png`
            const marker = '<!-- opencode-issue-summary -->'
            const summary = `${marker}\n## OpenCode Automation\n- Approved by: @${context.actor}\n- Issue: #${context.issue.number}\n- Build: \`npm run build\` passed in workflow\n- Screenshot artifact: [View \`${artifactName}\`](${runUrl})\n\n### Screenshot\n![Feature screenshot](${screenshotUrl})`
            const body = pr.body?.includes(marker)
              ? pr.body.replace(new RegExp(`${marker}[\\s\\S]*$`), summary)
              : `${pr.body ?? ''}\n\n${summary}`.trim()
            await github.rest.pulls.update({ owner, repo, pull_number, body })

  report-error:
    runs-on: ubuntu-latest
    needs: [check-auth, build]
    if: >
      failure() &&
      needs.check-auth.outputs.allowed == 'true' &&
      needs.check-auth.outputs.command == 'build'
    permissions:
      issues: write
    steps:
      - name: Create error issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            const title = `[OpenCode] Build failed for issue #${context.issue.number}`
            const body = `## Build Failure\n\n- **Original issue:** #${context.issue.number}\n- **Workflow run:** [View run](${runUrl})\n- **Triggered by:** @${context.actor}\n\nThe OpenCode build job failed during implementation. Please check the workflow run logs for details.`

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['bug', 'opencode'],
            })
