name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/content/blog/**'
      - 'scripts/sync-events.mjs'
      - 'scripts/migrate-member-photos.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Disable email confirmation (auto-confirm signups)
        run: |
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"mailer_autoconfirm": true}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Enable GitHub OAuth provider
        run: |
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "external_github_enabled": true,
              "external_github_client_id": "'"$SUPABASE_AUTH_GITHUB_CLIENT_ID"'",
              "external_github_secret": "'"$SUPABASE_AUTH_GITHUB_SECRET"'",
              "site_url": "https://se.polinema.ac.id",
              "uri_allow_list": "https://se.polinema.ac.id/**"
            }'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_GITHUB_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GITHUB_CLIENT_ID }}
          SUPABASE_AUTH_GITHUB_SECRET: ${{ secrets.SUPABASE_AUTH_GITHUB_SECRET }}

      - name: Enable Turnstile captcha for auth
        run: |
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "security_captcha_enabled": true,
              "security_captcha_provider": "turnstile",
              "security_captcha_secret": "'"$TURNSTILE_SECRET_KEY"'"
            }'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Ensure se schema is exposed via PostgREST
        # This project's Supabase instance is shared with another app (schema
        # "dosen4"). Its own setup has, at least once before, replaced the
        # PostgREST db_schema list wholesale rather than appending to it,
        # silently dropping "se" and breaking every client-side query this
        # site makes (anything using supabase.schema('se')...), including the
        # /admin role check. This step re-asserts "se" is present on every
        # deploy, merging into whatever schemas are currently exposed rather
        # than overwriting them, so it can't clobber dosen4's own config
        # either, and is a no-op once "se" is already there.
        run: |
          current=$(curl --fail-with-body -sS \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.db_schema')
          echo "Current db_schema: $current"
          if [ -z "$current" ] || [ "$current" = "null" ]; then
            echo "Could not read current db_schema config, refusing to guess and overwrite it" >&2
            exit 1
          fi
          if echo ",$current," | grep -q ',se,'; then
            echo "se already exposed, nothing to do"
          else
            updated="${current},se"
            curl --fail-with-body -sS -X PATCH \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"db_schema\": \"$updated\"}"
            echo "Updated db_schema to: $updated"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Set Edge Function secrets
        run: supabase secrets set TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync managed events into se.events
        run: npm run sync:events
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Migrate legacy member photos into Storage
        run: npm run migrate:member-photos
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
