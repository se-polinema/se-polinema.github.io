name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/content/blog/**'
      - 'scripts/sync-events.mjs'
      - 'scripts/migrate-member-photos.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Enable GitHub OAuth provider
        # This project's Supabase instance is shared with another app
        # (schema "dosen4", dosen4.makinmudah.com). Auth config is
        # project-wide, not schema-scoped, so this step used to PATCH
        # site_url/uri_allow_list unconditionally on every deploy — the
        # same class of clobbering bug already fixed below for PostgREST's
        # db_schema. Checked Supabase's own Management API schema
        # (UpdateAuthConfigBody): uri_allow_list is a mergeable comma-list
        # (same shape as db_schema) so it's merged, not overwritten, same
        # as the schema-exposure step. site_url is genuinely single-valued
        # (the API rejects commas in it — pattern "^[^,]+$") and can't hold
        # both apps' domains at once; this site's own signInWithOAuth calls
        # always pass an explicit redirectTo (GitHubSignInButton.vue), so
        # we don't actually depend on site_url being forced — only claim it
        # if empty or already ours, never clobber an existing foreign
        # value. external_github_* is genuinely single-tenant (one GitHub
        # OAuth app per project) — keep asserting ours, but refuse to
        # silently overwrite a different app's client_id if one is ever set.
        run: |
          current=$(curl --fail-with-body -sS \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")

          if [ -z "$current" ]; then
            echo "Could not read current auth config, refusing to guess and overwrite it" >&2
            exit 1
          fi

          current_site_url=$(echo "$current" | jq -r '.site_url // empty')
          current_github_client_id=$(echo "$current" | jq -r '.external_github_client_id // empty')

          echo "Current site_url: ${current_site_url:-<empty>}"
          echo "Current uri_allow_list: $(echo "$current" | jq -r '.uri_allow_list // "<empty>"')"

          # uri_allow_list: merge our entries in, preserving whatever's
          # already there (e.g. dosen4's own entries). Includes
          # localhost:4321 alongside the production domain so GitHub OAuth
          # redirects also work against `astro dev`/`astro preview` — same
          # local-dev allowance already made for Turnstile's CORS origins
          # in supabase/functions/_shared/turnstile.ts.
          new_uri_allow_list=$(echo "$current" | jq -r '
            (.uri_allow_list // "") as $cur
            | ($cur | split(",") | map(select(length > 0))) as $list
            | ["https://se.polinema.ac.id/**", "http://localhost:4321/**"] as $wanted
            | ($wanted - $list) as $missing
            | if ($missing | length) == 0 then $cur
              elif ($list | length) == 0 then ($missing | join(","))
              else ($list + $missing | join(","))
              end
          ')

          # site_url: only claim it if empty or already ours; never clobber
          # a value someone else (dosen4) may have set.
          if [ -z "$current_site_url" ] || [ "$current_site_url" = "https://se.polinema.ac.id" ]; then
            new_site_url="https://se.polinema.ac.id"
          else
            echo "site_url is already '$current_site_url' (likely dosen4's) — leaving it alone"
            new_site_url="$current_site_url"
          fi

          if [ -n "$current_github_client_id" ] && [ "$current_github_client_id" != "$SUPABASE_AUTH_GITHUB_CLIENT_ID" ]; then
            echo "external_github_client_id is already set to a different value than ours — refusing to overwrite (could be another app's GitHub OAuth config)" >&2
            exit 1
          fi

          body=$(jq -n \
            --arg client_id "$SUPABASE_AUTH_GITHUB_CLIENT_ID" \
            --arg secret "$SUPABASE_AUTH_GITHUB_SECRET" \
            --arg site_url "$new_site_url" \
            --arg uri_allow_list "$new_uri_allow_list" \
            '{
              external_github_enabled: true,
              external_github_client_id: $client_id,
              external_github_secret: $secret,
              site_url: $site_url,
              uri_allow_list: $uri_allow_list
            }')

          # Supabase's PATCH response echoes back the ENTIRE auth config,
          # including every configured provider's secret in cleartext
          # (GitHub/Google OAuth secrets, the Turnstile CAPTCHA secret,
          # etc.) — printing that unredirected leaked real secrets into
          # this repo's (public) Action logs on every deploy. Only surface
          # the body if the request actually failed, matching what's
          # needed to debug a failure without dumping secrets on the
          # common, successful path.
          patch_status=$(curl -sS -o /tmp/auth-config-patch-response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")

          if [ "$patch_status" -lt 200 ] || [ "$patch_status" -ge 300 ]; then
            echo "Auth config PATCH failed with HTTP $patch_status:" >&2
            cat /tmp/auth-config-patch-response.json >&2
            exit 1
          fi

          echo "Auth config updated successfully (HTTP $patch_status)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_GITHUB_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GITHUB_CLIENT_ID }}
          SUPABASE_AUTH_GITHUB_SECRET: ${{ secrets.SUPABASE_AUTH_GITHUB_SECRET }}

      - name: Ensure se schema is exposed via PostgREST
        # This project's Supabase instance is shared with another app (schema
        # "dosen4"). Its own setup has, at least once before, replaced the
        # PostgREST db_schema list wholesale rather than appending to it,
        # silently dropping "se" and breaking every client-side query this
        # site makes (anything using supabase.schema('se')...), including the
        # /admin role check. This step re-asserts "se" is present on every
        # deploy, merging into whatever schemas are currently exposed rather
        # than overwriting them, so it can't clobber dosen4's own config
        # either, and is a no-op once "se" is already there.
        run: |
          current=$(curl --fail-with-body -sS \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.db_schema')
          echo "Current db_schema: $current"
          if [ -z "$current" ] || [ "$current" = "null" ]; then
            echo "Could not read current db_schema config, refusing to guess and overwrite it" >&2
            exit 1
          fi
          if echo ",$current," | grep -q ',se,'; then
            echo "se already exposed, nothing to do"
          else
            updated="${current},se"
            # PostgREST's config response can include jwt_secret — same
            # reasoning as the auth-config PATCH above, suppress the body
            # unless the request actually failed.
            patch_status=$(curl -sS -o /tmp/postgrest-patch-response.json -w '%{http_code}' -X PATCH \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"db_schema\": \"$updated\"}")

            if [ "$patch_status" -lt 200 ] || [ "$patch_status" -ge 300 ]; then
              echo "PostgREST config PATCH failed with HTTP $patch_status:" >&2
              cat /tmp/postgrest-patch-response.json >&2
              exit 1
            fi

            echo "Updated db_schema to: $updated (HTTP $patch_status)"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Set Edge Function secrets
        # OPENCODE_GO_API_KEY already exists as a repo secret (used by the
        # opencode/weekly-recommendation dev-tooling workflows) and is a
        # plain bearer token for OpenCode Go's OpenAI-compatible REST
        # gateway — reused here for suggest-project-content rather than
        # provisioning a new AI provider.
        run: |
          supabase secrets set TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY"
          supabase secrets set OPENCODE_GO_API_KEY="$OPENCODE_GO_API_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync managed events into se.events
        run: npm run sync:events
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Migrate legacy member photos into Storage
        run: npm run migrate:member-photos
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
