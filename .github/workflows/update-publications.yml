name: Update Publications

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run publication sync
        run: node scripts/update-publications.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/content/publications/ src/data/_sync-meta.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build verification
        run: npm run build

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "sync: update publications from Google Scholar"
          title: "sync: update publications from Google Scholar (${{ github.run_date }})"
          body: |
            Automated publication sync from Google Scholar profiles.

            This PR was generated by the scheduled `update-publications` workflow.

            Closes #6
          labels: automated
