name: Update Publications

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GH_WORKFLOW_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run publication sync
        run: node scripts/update-publications.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/content/publications/ src/data/_sync-meta.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build verification
        run: npm run build

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_WORKFLOW_PAT }}
          commit-message: "sync: update publications from Google Scholar"
          title: "sync: update publications from Google Scholar (${{ github.run_date }})"
          body: |
            Automated publication sync from Google Scholar profiles.

            This PR was generated by the scheduled `update-publications` workflow.

            Closes #6
          labels: automated

      - name: Report workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Update Publications workflow failed on ${new Date().toISOString().split('T')[0]}`,
              body: `The [Update Publications workflow](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed.

            Please review the logs and create a `/plan` comment on this issue to resolve it.`,
              labels: ['automated']
            })
