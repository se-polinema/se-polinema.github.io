name: Update Publications

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

# Only one sync at a time (scheduled and manual runs share the Scholar quota).
concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  sync:
    # Runs on the organization's self-hosted runner: Google Scholar rate-limits
    # and blocks the shared IP ranges of GitHub-hosted runners, which left
    # src/data/_scholar-metrics.json stale. Narrow this with extra labels
    # (e.g. [self-hosted, linux]) if the org has several runners.
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Sync PRs follow the same beta-first flow as every other change.
          ref: develop
          persist-credentials: true
          token: ${{ secrets.GH_WORKFLOW_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run publication sync
        run: node scripts/update-publications.mjs

      # Cleanup/enrichment steps are best-effort: a Crossref outage must not
      # discard the Scholar data fetched above.
      - name: Normalize author lists
        run: node scripts/normalize-publication-authors.mjs

      - name: Add missing DOIs from Crossref
        continue-on-error: true
        run: node scripts/enrich-dois.mjs
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/content/publications/ src/data/_sync-meta.json src/data/_scholar-metrics.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build verification
        run: npm run build

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_WORKFLOW_PAT }}
          base: develop
          commit-message: "sync: update publications and scholar metrics"
          title: "sync: update publications and scholar metrics (${{ github.run_date }})"
          body: |
            Automated publication and scholar-metrics sync from Google Scholar profiles.

            This PR was generated by the scheduled `update-publications` workflow.

            Closes #6
          labels: automated

      - name: Report workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Update Publications workflow failed on ${new Date().toISOString().split('T')[0]}`,
              body: `The [Update Publications workflow](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed.

            Please review the logs and create a `/plan` comment on this issue to resolve it.`,
              labels: ['automated']
            })
