<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#004EA2"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#F0F2F5"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1628" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="8" fill="url(#bgGrad)"/>

  <!-- Step 1: User opens issue -->
  <g filter="url(#shadow)">
    <rect x="20" y="30" width="150" height="56" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="95" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">User opens an</text>
    <text x="95" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#111827">GitHub Issue</text>
  </g>

  <line x1="170" y1="58" x2="210" y2="58" stroke="#004EA2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: /plan command -->
  <g filter="url(#shadow)">
    <rect x="214" y="30" width="150" height="56" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="289" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Maintainer writes</text>
    <text x="289" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#004EA2">/plan</text>
  </g>

  <line x1="364" y1="58" x2="404" y2="58" stroke="#004EA2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Plan job -->
  <g filter="url(#shadow)">
    <rect x="408" y="20" width="170" height="76" rx="6" fill="white" stroke="#004EA2" stroke-width="1.5"/>
    <rect x="408" y="20" width="170" height="22" rx="6" fill="#004EA2"/>
    <rect x="408" y="30" width="170" height="12" fill="#004EA2"/>
    <text x="493" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white">GitHub Actions — Plan Job</text>
    <text x="493" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#374151">OpenCode analyzes issue</text>
    <text x="493" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#374151">Replies with plan</text>
  </g>

  <line x1="578" y1="58" x2="618" y2="58" stroke="#004EA2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: /build command -->
  <g filter="url(#shadow)">
    <rect x="622" y="30" width="150" height="56" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="697" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6B7280">Maintainer approves</text>
    <text x="697" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F5A100">/build</text>
  </g>

  <!-- Arrow from step 4 goes DOWN to step 5 -->
  <path d="M697 86 L697 120" stroke="#004EA2" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 5: Build job -->
  <g filter="url(#shadow)">
    <rect x="540" y="130" width="314" height="80" rx="6" fill="white" stroke="#F5A100" stroke-width="1.5"/>
    <rect x="540" y="130" width="314" height="22" rx="6" fill="#F5A100"/>
    <rect x="540" y="140" width="314" height="12" fill="#F5A100"/>
    <text x="697" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="white">GitHub Actions — Build Job</text>
    <text x="565" y="168" font-family="Inter, sans-serif" font-size="11" fill="#374151">OpenCode implements change</text>
    <text x="565" y="186" font-family="Inter, sans-serif" font-size="11" fill="#374151">Runs npm run build · Captures screenshot</text>
    <text x="565" y="204" font-family="Inter, sans-serif" font-size="11" fill="#374151">Opens pull request with build result</text>
  </g>

  <!-- Arrow from step 5 goes LEFT to step 6 -->
  <path d="M540 170 L40 170" stroke="#004EA2" stroke-width="1.5" fill="none"/>
  <polygon points="40,164 30,170 40,176" fill="#004EA2"/>

  <!-- Step 6: Review & merge -->
  <g filter="url(#shadow)">
    <rect x="44" y="220" width="172" height="64" rx="6" fill="white" stroke="#10B981" stroke-width="1.5"/>
    <text x="130" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981">Maintainer reviews</text>
    <text x="130" y="264" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981">and merges PR</text>
  </g>

  <!-- Labels -->
  <text x="660" y="118" font-family="Inter, sans-serif" font-size="10" fill="#9CA3AF">requires approval</text>

  <!-- Title -->
  <text x="450" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#004EA2">IssueOps Workflow — SE Laboratory Repository</text>
</svg>
