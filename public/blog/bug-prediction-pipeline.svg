<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="monospace" font-size="13">
  <defs>
    <style>
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 6; ry: 6; }
      .box-green { fill: #1e293b; stroke: #4ade80; stroke-width: 1.5; rx: 6; ry: 6; }
      .box-yellow { fill: #1e293b; stroke: #facc15; stroke-width: 1.5; rx: 6; ry: 6; }
      .box-purple { fill: #1e293b; stroke: #c084fc; stroke-width: 1.5; rx: 6; ry: 6; }
      .box-orange { fill: #1e293b; stroke: #fb923c; stroke-width: 1.5; rx: 6; ry: 6; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .txt { fill: #e2e8f0; text-anchor: middle; }
      .txt-small { fill: #94a3b8; text-anchor: middle; font-size: 11; }
      .label { fill: #94a3b8; text-anchor: middle; font-size: 10; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" class="txt" font-size="15" font-weight="bold">Bug Prediction Pipeline</text>

  <!-- Row 1: Data Sources -->
  <rect x="30" y="55" width="170" height="60" class="box" />
  <text x="115" y="82" class="txt">Version Control</text>
  <text x="115" y="100" class="txt-small">(Git Log)</text>

  <rect x="230" y="55" width="170" height="60" class="box" />
  <text x="315" y="82" class="txt">Issue Tracker</text>
  <text x="315" y="100" class="txt-small">(Bug Reports)</text>

  <rect x="430" y="55" width="170" height="60" class="box" />
  <text x="515" y="82" class="txt">Static Analysis</text>
  <text x="515" y="100" class="txt-small">(PHPStan / SonarQube)</text>

  <rect x="630" y="55" width="170" height="60" class="box" />
  <text x="715" y="82" class="txt">Code Reviews</text>
  <text x="715" y="100" class="txt-small">(Pull Requests)</text>

  <!-- Arrows from Row 1 to Row 2 -->
  <line x1="115" y1="115" x2="300" y2="160" class="arrow" />
  <line x1="315" y1="115" x2="300" y2="160" class="arrow" />
  <line x1="515" y1="115" x2="600" y2="160" class="arrow" />
  <line x1="715" y1="115" x2="600" y2="160" class="arrow" />

  <!-- Row 2: Feature Engineering -->
  <rect x="200" y="165" width="200" height="65" class="box-green" />
  <text x="300" y="190" class="txt">Feature Engineering</text>
  <text x="300" y="207" class="txt-small">LOC, Cyclomatic Complexity,</text>
  <text x="300" y="220" class="txt-small">Churn, Code Ownership</text>

  <rect x="500" y="165" width="200" height="65" class="box-green" />
  <text x="600" y="190" class="txt">Labeling</text>
  <text x="600" y="207" class="txt-small">Buggy / Clean</text>
  <text x="600" y="220" class="txt-small">(Binary Classification)</text>

  <!-- Arrow from Row 2 to Row 3 -->
  <line x1="300" y1="230" x2="300" y2="275" class="arrow" />
  <line x1="600" y1="230" x2="600" y2="275" class="arrow" />

  <!-- Row 3: Dataset -->
  <rect x="310" y="280" width="280" height="50" class="box-yellow" />
  <text x="450" y="303" class="txt">Synthetic Dataset in PHP</text>
  <text x="450" y="320" class="txt-small">Features + Labels (50 modules)</text>

  <!-- Arrow from Row 3 to Row 4 -->
  <line x1="450" y1="330" x2="450" y2="375" class="arrow" />

  <!-- Row 4: Model -->
  <rect x="310" y="380" width="280" height="50" class="box-purple" />
  <text x="450" y="402" class="txt">Naive Bayes Classifier</text>
  <text x="450" y="419" class="txt-small">Train / Test Split (80/20)</text>

  <!-- Arrow branching to Row 5 -->
  <line x1="450" y1="430" x2="300" y2="475" class="arrow" />
  <line x1="450" y1="430" x2="600" y2="475" class="arrow" />

  <!-- Row 5: Evaluation -->
  <rect x="200" y="480" width="200" height="55" class="box-orange" />
  <text x="300" y="503" class="txt">Model Evaluation</text>
  <text x="300" y="520" class="txt-small">Precision · Recall · F1</text>

  <rect x="500" y="480" width="200" height="55" class="box-orange" />
  <text x="600" y="503" class="txt">Confusion Matrix</text>
  <text x="600" y="520" class="txt-small">TP · FP · TN · FN</text>

  <!-- Output arrow -->
  <line x1="300" y1="535" x2="300" y2="580" class="arrow" />
  <line x1="600" y1="535" x2="600" y2="580" class="arrow" />

  <!-- Row 6: Result -->
  <rect x="310" y="585" width="280" height="45" class="box-green" />
  <text x="450" y="608" class="txt">Bug Probability Score</text>
  <text x="450" y="622" class="txt-small">High-Risk Modules → Prioritize Review</text>
</svg>